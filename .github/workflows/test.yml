name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - run: npm test
