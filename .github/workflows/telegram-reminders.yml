name: telegram-reminders

# Hourly rather than daily so each user's reminder_hour and timezone can be
# honoured; the endpoint itself decides who is due and is idempotent per
# local day, so an extra or delayed run cannot double-message anyone.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reminder run
        env:
          APP_URL: ${{ secrets.LUKU_APP_URL }}
          CRON_SECRET: ${{ secrets.TELEGRAM_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "LUKU_APP_URL or TELEGRAM_CRON_SECRET is not configured" >&2
            exit 1
          fi

          status=$(curl -sS --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -o response.json -w '%{http_code}' \
            -X POST "${APP_URL%/}/api/telegram/cron" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          echo "HTTP ${status}"
          cat response.json
