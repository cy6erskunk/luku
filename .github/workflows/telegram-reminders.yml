name: telegram-reminders

# Fallback trigger. A Val Town cron (scripts/valtown-reminder-cron.ts) is the
# primary one, because GitHub deprioritizes scheduled workflows under load and
# drops runs outright — gaps of 9-11 hours have been observed here, long enough
# to skip a user's whole reminder window. This stays enabled anyway: the
# endpoint is idempotent per user per local day, so the overlap is a no-op and
# two unreliable triggers miss far less than one.
#
# Minute 37 rather than the contended top of the hour, and offset from the Val
# Town cron at :07 so the two are spread across the hour.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reminder run
        env:
          APP_URL: ${{ secrets.LUKU_APP_URL }}
          CRON_SECRET: ${{ secrets.TELEGRAM_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "LUKU_APP_URL or TELEGRAM_CRON_SECRET is not configured" >&2
            exit 1
          fi

          status=$(curl -sS --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -o response.json -w '%{http_code}' \
            -X POST "${APP_URL%/}/api/telegram/cron" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          echo "HTTP ${status}"
          cat response.json
